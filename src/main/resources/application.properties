# Server
server.port=${PORT:8080}
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=20000


# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
# Access token validity: 15 minutes (900000 ms).
jwt.expiration=900000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Supabase
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=social-media

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# App
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Email sender branding
# From address shown to recipients (Gmail SMTP sends on their behalf)
app.mail.display-name=${APP_MAIL_DISPLAY_NAME:FriendsHub}
app.mail.from-address=${APP_MAIL_FROM:noreply@friendshub.me}
app.mail.reply-to=${APP_MAIL_REPLY_TO:support@friendshub.me}

# Verification and reset link base URLs (no trailing slash)
app.verification-url=${APP_VERIFICATION_URL:https://friendshub.me/verify}
app.reset-password-url=${APP_RESET_PASSWORD_URL:https://friendshub.me/reset-password}

# Rate Limiting
app.ratelimit.requests-per-minute=60
app.ratelimit.per-user.requests-per-minute=30
app.ratelimit.global.requests-per-minute=1000

# Actuator
# Only expose health publicly; other actuator endpoints (prometheus, metrics)
# require authentication via SecurityConfig's ACTUATOR role check.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
# Disable default Prometheus endpoint path to prevent accidental public access
management.endpoints.web.base-path=/actuator

# Error handling (duplicated below in SECURITY section — keeping the more complete block)
server.error.include-binding-errors=never

# Resilience4j
resilience4j.circuitbreaker.instances.chatService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.chatService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.chatService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=10s

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =====================================================
# PERFORMANCE: Enable Gzip compression
# Reduces JSON response size on mobile and slow connections
# =====================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# =====================================================
# PERFORMANCE: HikariCP connection pool tuning (Optimized for Render 512MB RAM)
# =====================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# =====================================================
# SECURITY: Never show stack traces in API error responses
# =====================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# =====================================================
# SECURITY: Prevent oversized request bodies from
# crashing or DoS-ing the server
# =====================================================
server.tomcat.max-swallow-size=2097152
server.tomcat.max-http-form-post-size=2097152

# =====================================================
# REDIS CONFIG (Upstash Redis for prod, localhost for local)
# =====================================================
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:4}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:2}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:1}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}


# =====================================================
# CACHE CONFIG (Redis-backed)
# =====================================================
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Fix Redis/JPA repository scanning conflict
spring.data.redis.repositories.enabled=false

